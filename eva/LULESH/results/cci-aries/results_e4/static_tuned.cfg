# E4: Introspection + Adaptive Tuning Configuration
# Start with uniform thread counts, let the analysis script optimize

[OpenMP.global]
    trace_mode = STANDBY

[Lexgion.default]
    trace_starts_at = 0
    max_num_traces = 50
    tracing_rate = 1
    trace_mode_after = STANDBY

# All regions start with max threads (will be tuned by analysis script)
[Knob]
    init_stress                    = 8
    integrate_stress_elem          = 24
    integrate_stress_node          = 16
    hourglass_force                = 24
    hourglass_node                 = 16
    hourglass_control              = 24
    volume_force_determ            = 8
    force_nodes_init               = 8
    acceleration                   = 8
    accel_boundary                 = 8
    velocity                       = 8
    position                       = 8
    kinematics                     = 24
    lagrange_elem_error            = 8
    monotonic_q_grad               = 24
    monotonic_q_region             = 24
    pressure_bvc                   = 8
    pressure_calc                  = 16
    energy_init                    = 8
    energy_compress                = 16
    energy_q_half                  = 8
    energy_q_full                  = 16
    energy_q_final                 = 16
    sound_speed                    = 16
    eos_alloc                      = 16
    eos_region                     = 8
    material_props                 = 16
    update_volumes                 = 8
    courant_constraint             = 16
    hydro_constraint               = 16

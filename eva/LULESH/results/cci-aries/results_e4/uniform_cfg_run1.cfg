# E4: Introspection + Adaptive Tuning Configuration
# Start with uniform thread counts, let the analysis script optimize

[OpenMP.global]
    trace_mode = STANDBY

[Lexgion.default]
    trace_starts_at = 0
    max_num_traces = 50
    tracing_rate = 1
    trace_mode_after = STANDBY

# All regions start with max threads (will be tuned by analysis script)
[Knob]
    init_stress                    = 4
    integrate_stress_elem          = 48
    integrate_stress_node          = 24
    hourglass_force                = 48
    hourglass_node                 = 24
    hourglass_control              = 48
    volume_force_determ            = 4
    force_nodes_init               = 4
    acceleration                   = 4
    accel_boundary                 = 4
    velocity                       = 4
    position                       = 4
    kinematics                     = 48
    lagrange_elem_error            = 4
    monotonic_q_grad               = 48
    monotonic_q_region             = 48
    pressure_bvc                   = 4
    pressure_calc                  = 24
    energy_init                    = 4
    energy_compress                = 24
    energy_q_half                  = 4
    energy_q_full                  = 24
    energy_q_final                 = 24
    sound_speed                    = 24
    eos_alloc                      = 24
    eos_region                     = 4
    material_props                 = 24
    update_volumes                 = 4
    courant_constraint             = 24
    hydro_constraint               = 24

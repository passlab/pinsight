# Cyclic INTROSPECT test configuration
# Each cycle: trace 30 iterations → INTROSPECT → analyze → resume TRACING
# Expected: 3+ cycles during 500 iterations of LULESH

[OpenMP.global]
    trace_mode = TRACING

[Lexgion.default]
    trace_starts_at = 0
    max_num_traces = 30
    tracing_rate = 1
    trace_mode_after = INTROSPECT:10:/home/yyan7/tools/pinsight/eva/LULESH/scripts/cyclic_analyze.sh:TRACING

[Knob]
    integrate_stress_elem          = 24
    kinematics                     = 24
    velocity                       = 24
    position                       = 24
    acceleration                   = 24
    init_stress                    = 24
    hourglass_force                = 24
    hourglass_control              = 24
    monotonic_q_grad               = 24
    monotonic_q_region             = 24

# E4: Introspection + Adaptive Tuning Configuration
# Start with uniform thread counts, let the analysis script optimize

[OpenMP.global]
    trace_mode = TRACING

[Lexgion.default]
    trace_starts_at = 0
    max_num_traces = 100
    tracing_rate = 1
    trace_mode_after = INTROSPECT:60:analyze_and_tune.sh:STANDBY

# All regions start with max threads (will be tuned by analysis script)
[Knob]
    init_stress                    = 4
    integrate_stress_elem          = 8
    integrate_stress_node          = 4
    hourglass_force                = 8
    hourglass_node                 = 4
    hourglass_control              = 8
    volume_force_determ            = 4
    force_nodes_init               = 4
    acceleration                   = 4
    accel_boundary                 = 4
    velocity                       = 4
    position                       = 4
    kinematics                     = 8
    lagrange_elem_error            = 4
    monotonic_q_grad               = 8
    monotonic_q_region             = 8
    pressure_bvc                   = 4
    pressure_calc                  = 4
    energy_init                    = 4
    energy_compress                = 4
    energy_q_half                  = 4
    energy_q_full                  = 4
    energy_q_final                 = 4
    sound_speed                    = 4
    eos_alloc                      = 4
    eos_region                     = 4
    material_props                 = 4
    update_volumes                 = 4
    courant_constraint             = 4
    hydro_constraint               = 4
